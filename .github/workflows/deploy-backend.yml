name: Deploy Backend → Lambda

on:
  push:
    branches: [main]
    paths:
      - "backend/**"
      - "data/**"
      - "Dockerfile"
      - ".github/workflows/deploy-backend.yml"

env:
  AWS_REGION: us-east-1
  TF_VERSION: "1.9.8"

jobs:
  deploy:
    name: Build & Deploy
    runs-on: ubuntu-latest

    steps:
      # ── Checkout ────────────────────────────────────────────────────────────
      - name: Checkout
        uses: actions/checkout@v4

      # ── AWS Credentials ─────────────────────────────────────────────────────
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      # ── Read infra values from Terraform outputs ─────────────────────────────
      # This ensures deploy-backend always targets whatever Terraform provisioned,
      # rather than duplicating resource names as workflow env vars.
      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}
          terraform_wrapper: false   # raw output, no wrapper annotations

      - name: Read Terraform outputs
        working-directory: terraform
        run: |
          terraform init -input=false
          echo "ECR_REGISTRY=$(terraform output -raw ecr_repository_url)" >> $GITHUB_ENV
          echo "LAMBDA_FUNCTION=$(terraform output -raw lambda_function_name)" >> $GITHUB_ENV

      # ── ECR Login ───────────────────────────────────────────────────────────
      - name: Login to Amazon ECR
        uses: aws-actions/amazon-ecr-login@v2

      # ── Build & Push ─────────────────────────────────────────────────────────
      - name: Build, tag, and push image
        run: |
          docker build \
            -t $ECR_REGISTRY:$GITHUB_SHA \
            -t $ECR_REGISTRY:latest \
            .
          docker push $ECR_REGISTRY:$GITHUB_SHA
          docker push $ECR_REGISTRY:latest

      # ── Update Lambda ────────────────────────────────────────────────────────
      - name: Deploy to Lambda
        run: |
          aws lambda update-function-code \
            --function-name $LAMBDA_FUNCTION \
            --image-uri $ECR_REGISTRY:$GITHUB_SHA

          aws lambda wait function-updated \
            --function-name $LAMBDA_FUNCTION

      # ── Summary ──────────────────────────────────────────────────────────────
      - name: Job summary
        run: |
          URL=$(aws lambda get-function-url-config \
            --function-name $LAMBDA_FUNCTION \
            --query FunctionUrl --output text)
          echo "🚀 Deployed \`$GITHUB_SHA\` → $URL" >> $GITHUB_STEP_SUMMARY

# ── Required GitHub secrets ──────────────────────────────────────────────────
# AWS_ACCESS_KEY_ID / AWS_SECRET_ACCESS_KEY — IAM user needs:
#   ecr:* on the repository
#   lambda:UpdateFunctionCode + lambda:GetFunctionUrlConfig + lambda:WaitForFunctionUpdated
#   s3:GetObject on the Terraform state bucket (to read outputs)
#
# Lambda execution role permissions are managed by Terraform (terraform/lambda.tf)

name: Deploy Frontend → S3 + CloudFront

on:
  push:
    branches: [main]
    paths:
      - "frontend/**"
      - ".github/workflows/deploy-frontend.yml"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  AWS_REGION: ${{ vars.AWS_REGION || 'us-east-2' }}

jobs:
  deploy:
    name: Build & Deploy
    runs-on: ubuntu-latest
    permissions:
      contents: read   # only need to read the repo; AWS ops use explicit credentials
    defaults:
      run:
        working-directory: frontend

    steps:
      # ── Checkout ────────────────────────────────────────────────────────────
      - name: Checkout
        uses: actions/checkout@v4

      # ── Node setup ──────────────────────────────────────────────────────────
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      # ── AWS Credentials ─────────────────────────────────────────────────────
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      # ── Build ────────────────────────────────────────────────────────────────
      - name: Install dependencies
        run: npm ci

      - name: Build
        env:
          # Injected at build time so the bundle knows where to send API calls.
          # Value is the Lambda Function URL, stored as a GitHub Actions variable.
          VITE_API_URL: ${{ vars.VITE_API_URL }}
        run: npm run build

      # ── Deploy to S3 ─────────────────────────────────────────────────────────
      # Two-pass sync to set different Cache-Control headers per file type:
      #   assets/**  → immutable, cache for 1 year (Vite content-hashes filenames)
      #   everything else (index.html, etc.) → no-cache (always check for updates)
      # --delete removes files in S3 that no longer exist in the build output.
      - name: Sync assets to S3 (long cache)
        run: |
          aws s3 sync dist/assets/ s3://${{ vars.FRONTEND_BUCKET }}/assets/ \
            --cache-control "max-age=31536000,immutable" \
            --delete

      - name: Sync root files to S3 (no cache)
        run: |
          aws s3 sync dist/ s3://${{ vars.FRONTEND_BUCKET }}/ \
            --cache-control "no-cache" \
            --exclude "assets/*" \
            --delete

      # ── Invalidate CloudFront cache ──────────────────────────────────────────
      # CloudFront caches files at edge locations. After uploading new files to
      # S3, we invalidate /* so edges fetch fresh copies on the next request.
      # The first 1,000 invalidation paths/month are free; /* counts as one path.
      - name: Invalidate CloudFront cache
        run: |
          aws cloudfront create-invalidation \
            --distribution-id ${{ vars.CF_DISTRIBUTION_ID }} \
            --paths "/*"

      # ── Summary ──────────────────────────────────────────────────────────────
      - name: Job summary
        run: |
          echo "🚀 Frontend deployed → https://$(aws cloudfront get-distribution \
            --id ${{ vars.CF_DISTRIBUTION_ID }} \
            --query 'Distribution.DomainName' --output text)" >> $GITHUB_STEP_SUMMARY

# ── Required GitHub configuration ───────────────────────────────────────────
# Secrets (Settings → Secrets and variables → Actions → Secrets):
#   AWS_ACCESS_KEY_ID      — CI IAM user (created by scripts/bootstrap.sh)
#   AWS_SECRET_ACCESS_KEY  — CI IAM user secret
#
# Variables (Settings → Secrets and variables → Actions → Variables):
#   AWS_REGION             — e.g. us-east-2
#   FRONTEND_BUCKET        — S3 bucket name (printed by make bootstrap)
#   CF_DISTRIBUTION_ID     — CloudFront distribution ID (printed by make bootstrap)
#   VITE_API_URL           — Lambda Function URL (printed by make bootstrap)

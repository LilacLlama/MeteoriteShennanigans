version: 2

models:
  - name: meteorites
    description: |
      Final fact table — one row per meteorite with valid coordinates.
      Served directly by `/api/meteorites` and used as the source for raw-point
      spatial queries (the magnet yield endpoint does a haversine filter here,
      then joins to `dim_meteorite_class` for the per-class metal fraction).
    columns:
      - name: id
        tests:
          - not_null
          - unique
      - name: latitude
        tests:
          - not_null
      - name: longitude
        tests:
          - not_null
      - name: class_group
        description: Canonical class family. FK to `dim_meteorite_class`.
        tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_meteorite_class')
                field: class_group

  - name: dim_meteorite_class
    description: |
      One row per canonical `class_group`. Source-of-truth physical attributes
      come from the `meteorite_class_composition` seed; derived columns
      (`magnetic_tier`, `is_magnetically_catchable`) are computed here so the
      seed stays pure data and the interpretation is versioned in code.
    columns:
      - name: class_group
        tests:
          - not_null
          - unique
      - name: metal_fraction_pct
        tests:
          - not_null
          - dbt_utils.accepted_range:
              arguments:
                min_value: 0
                max_value: 100
      - name: magnetic_tier
        tests:
          - not_null
          - accepted_values:
              arguments:
                values: ['strong', 'medium', 'weak', 'none']
      - name: is_magnetically_catchable
        tests:
          - not_null

  - name: meteorites_by_s2
    description: |
      Meteorites bucketed into S2 cells at LEVELS 3, 4, 5, 6, 7 — one row
      per (level, s2_cell). The frontend picks the active level based on
      map zoom (continent → state → metro), so this single mart drives the
      density heatmap at every granularity.

      Cell IDs are hex tokens (strings) because the underlying int64 loses
      precision in JavaScript Number. Tokens at different levels have
      distinct bit-encodings, so `s2_cell` remains unique across the entire
      table (no need for a composite key).

      `iron_mass_g` is the per-cell sum of free Fe-Ni metal mass — the
      physically meaningful "magnet yield" quantity. `count` is the total
      number of meteorites in the cell.

      S2 was chosen over H3 for its exact hierarchical aggregation:
      `sum(4 children) = parent` with no overlap, no pentagon edge cases.
      The numbers at level 3 are the EXACT sum of the corresponding cells
      at level 4 — not an approximation. That property is what makes
      multi-zoom heatmaps trustworthy as the same data viewed at different
      granularities, not four separate estimates.
    columns:
      - name: s2_cell
        description: S2 cell ID as a hex token (e.g. "af0c"). String for JS precision. Unique across levels.
        tests:
          - not_null
          - unique
      - name: count
        tests:
          - not_null
      - name: iron_mass_g
        tests:
          - not_null
      - name: level
        description: S2 level (3, 4, 5, 6, or 7). Filter on this in queries.
        tests:
          - not_null
          - accepted_values:
              arguments:
                values: [3, 4, 5, 6, 7]

  - name: meteorites_by_class
    description: |
      Aggregate by canonical class_group (~35 buckets) with magnetic_tier
      joined in. The class_group bucketing — not raw recclass (~400 distinct
      values) — is what lines up with the magnet-yield interpretation.
    columns:
      - name: class_group
        tests:
          - not_null
          - unique
      - name: magnetic_tier
        tests:
          - accepted_values:
              arguments:
                values: ['strong', 'medium', 'weak', 'none']

  - name: meteorites_by_decade
    description: Aggregate by decade. Surfaces the post-1980 Antarctic discovery boom.
    columns:
      - name: decade
        tests:
          - not_null
          - unique
